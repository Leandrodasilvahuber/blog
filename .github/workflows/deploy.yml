name: Deploy produção

on:
  push:
    branches: [producao]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & build frontend assets
        run: |
          npm ci
          npm run build

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Upload built assets
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
          rsync -avz --delete public/build/ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/blog/public/build/

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ADMIN_EMAIL,ADMIN_PASSWORD
          script: |
            cd /var/www/blog
            git fetch origin producao
            git reset --hard origin/producao
            composer install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force
            php artisan db:seed --class="Database\\Seeders\\AdminUserSeeder" --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            sudo systemctl reload php8.5-fpm
